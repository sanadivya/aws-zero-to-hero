
version: 0.0
os: linux

files:
  - source: scripts/
    destination: /opt/simple-python-flask-app/scripts

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 300
      runas: root
